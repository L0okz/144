<!doctype html>
<html lang="en" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OX PS4 · Offline Cache</title>
  <style>
    :root{color-scheme:dark;--bg:#080d16;--panel:#111d2d;--line:#2a405d;--fg:#e7f0fb;--dim:#8ea2bd;--accent:#48b8ff;--ok:#66e0b1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 25%,rgba(35,116,178,.2),transparent 55%),var(--bg);color:var(--fg);font:15px/1.5 "Segoe UI",system-ui,sans-serif;text-align:center}
    main{width:92%;max-width:540px;padding:34px;border:1px solid rgba(113,157,207,.28);border-radius:16px;background:linear-gradient(145deg,#14243a,#0e1828);box-shadow:0 25px 80px rgba(0,0,0,.38)}
    .mark{width:48px;height:48px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid rgba(72,184,255,.55);border-radius:13px;color:var(--accent);font:800 16px Consolas,monospace;box-shadow:0 0 24px rgba(72,184,255,.14)}
    .eyebrow{margin:0 0 8px;color:var(--accent);font:700 10px Consolas,monospace;letter-spacing:.2em}h1{margin:0;color:#f5f8fc;font-size:23px;letter-spacing:-.02em}#status{margin:20px 0 14px;color:var(--ok);font:13px Consolas,monospace}
    #bar{height:9px;background:#263a55;border-radius:12px;overflow:hidden}#fill{height:100%;width:0;background:linear-gradient(90deg,#268fca,#66e0b1);transition:width .15s}
    #detail{font:11px/1.6 Consolas,monospace;color:var(--dim);white-space:pre-wrap;margin-top:15px}
    #return{display:inline-block;margin-top:22px;padding:12px 20px;border:1px solid #2999d3;border-radius:8px;background:linear-gradient(105deg,#167bb2,#3154a9);color:#fff;font-weight:700;font-size:12px;letter-spacing:.1em;cursor:pointer}
    @media(max-width:520px){main{padding:26px 20px}h1{font-size:20px}}
  </style>
</head>
<body>
<main>
  <div class="mark">OX</div>
  <p class="eyebrow">FIRST-TIME SETUP</p>
  <h1>Preparing offline support</h1>
  <div id="status">Preparing offline files…</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="detail">Keep this page open until caching finishes.</div>
  <button id="return" type="button" style="display:inline-block;margin-top:18px;padding:12px 20px;border:0;border-radius:7px;background:#7fd0a0;color:#07110b;font-weight:bold;font-size:15px">Return to OX PS4</button>
</main>
<script>
(function(){
  var ac=window.applicationCache;
  var status=document.getElementById("status");
  var detail=document.getElementById("detail");
  var fill=document.getElementById("fill");
  var returnButton=document.getElementById("return");
  var completed=false, idleSince=0, redirectTimer=null;

  function goHome(){ window.location.replace("./index.html"); }
  if(returnButton) returnButton.onclick=goHome;

  function done(message){
    if(completed) return;
    completed=true;
    status.textContent=message;
    fill.style.width="100%";
    detail.textContent="Offline cache is ready. Returning to OX PS4…";
    if(returnButton) returnButton.style.display="inline-block";
    if(redirectTimer) clearTimeout(redirectTimer);
    redirectTimer=setTimeout(goHome,2200);
  }

  if(!ac){
    status.textContent="Application Cache is not supported";
    detail.textContent="This browser does not expose the Application Cache API.";
    if(returnButton) returnButton.style.display="inline-block";
    return;
  }

  ac.addEventListener("checking",function(){ idleSince=0; status.textContent="Checking cache…"; });
  ac.addEventListener("downloading",function(){ idleSince=0; status.textContent="Downloading offline files…"; });
  ac.addEventListener("progress",function(e){
    if(e.total){
      var percent=Math.round(e.loaded/e.total*100);
      fill.style.width=percent+"%";
      detail.textContent="Installing "+percent+"% ("+e.loaded+"/"+e.total+")";
    }
  });
  ac.addEventListener("cached",function(){ done("Offline cache installed ✓"); });
  ac.addEventListener("noupdate",function(){ done("Offline cache already current ✓"); });
  ac.addEventListener("updateready",function(){
    try{ ac.swapCache(); }catch(e){}
    done("Offline cache updated ✓");
  });
  ac.addEventListener("error",function(){
    status.textContent="Cache event finished with an error";
    detail.textContent="Cache reported an error. If files are already cached, use the return button.";
    if(returnButton) returnButton.style.display="inline-block";
  });
  ac.addEventListener("obsolete",function(){
    status.textContent="Cache manifest is obsolete";
    detail.textContent="The offline manifest is no longer valid.";
    if(returnButton) returnButton.style.display="inline-block";
  });

  // Fallback for PS4 WebKit versions that omit cached/noupdate events.
  var startedAt=Date.now();
  var poll=setInterval(function(){
    if(completed){ clearInterval(poll); return; }
    var state=ac.status;
    if(state===ac.IDLE || state===ac.UPDATEREADY){
      if(!idleSince) idleSince=Date.now();
      if(Date.now()-idleSince>=2500 && Date.now()-startedAt>=3000){
        if(state===ac.UPDATEREADY){ try{ ac.swapCache(); }catch(e){} }
        done("Offline cache ready ✓");
      }
    }else{
      idleSince=0;
      if(state===ac.CHECKING) status.textContent="Checking cache…";
      if(state===ac.DOWNLOADING) status.textContent="Downloading offline files…";
    }
  },500);

  // Manual escape hatch if automatic navigation is blocked by the browser.
  setTimeout(function(){ if(returnButton) returnButton.style.display="inline-block"; },1500);
})();
</script>
</body>
</html>
