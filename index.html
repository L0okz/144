<!doctype html>
<html class="landing" lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OX PS4</title>
    <script>
      (function () {
        var appCache = window.applicationCache;
        if (!appCache) return;
        try {
          // Only send a first-time visitor to the installer page.
          // CHECKING/DOWNLOADING can occur during the return navigation too;
          // redirecting on those states creates a cache.html <-> index.html loop.
          if (appCache.status === appCache.UNCACHED) {
            location.replace("./cache.html");
            return;
          }
          if (appCache.status === appCache.UPDATEREADY) {
            appCache.swapCache();
            location.reload();
          }
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Every run starts from here. The referrer guard in jb.js arms the chain
         only when it was reached from this page, so that a browser restoring
         its last session cannot re-run it unattended. -->
    <div id="brand"><b>OX PS4</b></div>

    <div class="shell">
      <img class="meme" src="meme.png" alt="" />

      <main class="panel">
        <p class="lede">PS4 kernel exploit &middot; firmware 14.00</p>

        <form class="pick" id="pick">
          <label class="opt">
            <input type="radio" name="payload" value="hen" />
            <span>ps4-hen</span>
          </label>
          <label class="opt">
            <input type="radio" name="payload" value="goldhen" checked />
            <span>GoldHEN</span>
          </label>

          <label class="opt opt-auto">
            <input type="checkbox" id="auto" checked />
            <span>autostart</span>
          </label>

          <button class="btn" type="submit">start</button>
          <p class="count" id="count"></p>
        </form>
      </main>
    </div>

    <p class="byline">by o_x</p>
    <script src="launch.js"></script>
  </body>
</html>
